
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KIDSS smartphone product details">
    <title>პროდუქტის დეტალები | KIDSS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
    <script src="script.js" defer></script>
</head>
<body data-page="product">

    <header class="detail-header">
        <div class="detail-header-inner">
            <a href="index.html" class="detail-logo">KIDSS.</a>

            <nav class="detail-navigation">
                <a href="index.html">მთავარი</a>
                <a href="index.html#catalog">ტელეფონები</a>
            </nav>

            <button id="cartButton" class="detail-cart-button">
                კალათა
                <span id="cartCount">0</span>
            </button>
        </div>
    </header>

    <main class="detail-main">

        <div class="detail-breadcrumb">
            <a href="index.html">მთავარი</a>
            <span>/</span>
            <a href="index.html#catalog">ტელეფონები</a>
            <span>/</span>
            <span id="breadcrumbName">პროდუქტი</span>
        </div>

        <section class="product-detail">

            <div class="detail-image-container">
                <img id="detailImage" src="" alt="პროდუქტის სურათი">
            </div>

            <div class="detail-content">
                <span id="detailBrand" class="detail-brand"></span>

                <h1 id="detailName"></h1>

                <p id="detailDescription" class="detail-description"></p>

                <div class="detail-divider"></div>

                <h2>ტექნიკური მახასიათებლები</h2>

                <ul id="specList" class="detail-specs"></ul>

                <div class="detail-divider"></div>

                <div class="detail-purchase">
                    <span id="detailPrice" class="detail-price"></span>

                    <button id="detailAddButton" class="add-button detail-add-button">
                        კალათაში დამატება
                    </button>

                    <p id="detailNotice" class="detail-notice" hidden></p>
                </div>

                <a href="index.html#catalog" class="back-to-catalog">
                    ← უკან მაღაზიაში
                </a>
            </div>

        </section>

    </main>

    <div id="cartOverlay" class="cart-overlay"></div>

    <aside id="cartPanel" class="cart-panel">
        <div class="cart-header">
            <h2>თქვენი კალათა</h2>
            <button id="closeCart" class="close-cart">×</button>
        </div>

        <div id="cartItems" class="cart-items"></div>

        <div class="cart-footer">
            <div class="cart-total-row">
                <span>სრული თანხა</span>
                <strong id="cartTotal">0 ₾</strong>
            </div>

            <button id="checkoutButton" class="checkout-button">
                შეკვეთის გაფორმება
            </button>

            <p id="checkoutMessage" class="checkout-message"></p>
        </div>
    </aside>

</body>
</html>
